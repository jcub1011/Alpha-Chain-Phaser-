name: Export Game Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      release_name:
        description: 'Release title (leave blank to use tag name)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Save as draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run export script
        run: npm run export:game:install

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag_name }}
          draft: ${{ inputs.draft }}
          files: |
            dist-game/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}