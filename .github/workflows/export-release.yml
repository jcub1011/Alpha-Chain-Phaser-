name: Export Game Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (leave blank to auto-use version from GAME.json)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Release title (leave blank to use tag name)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Save as draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run export script
        run: npm run export:game

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(jq -r '.version' export/GAME.json)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || steps.resolve_tag.outputs.tag }}
          draft: ${{ inputs.draft }}
          files: |
            dist-game/**
            export/GAME.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Portable catalog registration
      - name: Sync to Marketplace Catalog
        if: ${{ !inputs.draft }}
        uses: jcub1011/KnockBox-Games-Marketplace/.github/actions/sync-catalog@main
        with:
          tag: ${{ steps.resolve_tag.outputs.tag }}
          marketplace-token: ${{ secrets.MARKETPLACE_TOKEN }}