<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="Alpha Chain">
  <defs>
    <!-- Background Gunmetal Base -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1c1916"/>
      <stop offset="50%" stop-color="#14120f"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>

    <!-- Warm Machine Shop Ambient Radial -->
    <radialGradient id="ambientWarmth" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0%" stop-color="#3a3228" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#26221e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14120f" stop-opacity="0"/>
    </radialGradient>

    <!-- Hardened Steel Card Body (Lit from upper-left) -->
    <linearGradient id="cardBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#352f28"/>
      <stop offset="40%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1c1916"/>
    </linearGradient>

    <!-- Milled Stock (Letter Tiles) -->
    <linearGradient id="stockFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eae2d2"/>
      <stop offset="35%" stop-color="#dcd2be"/>
      <stop offset="100%" stop-color="#c4b9a3"/>
    </linearGradient>

    <!-- Polished Brass (Starter Matrix Tile) -->
    <linearGradient id="brassFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fae09a"/>
      <stop offset="30%" stop-color="#e0b25c"/>
      <stop offset="100%" stop-color="#b88530"/>
    </linearGradient>

    <!-- Brass Submit Button -->
    <linearGradient id="btnBrassFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d588"/>
      <stop offset="35%" stop-color="#d9a548"/>
      <stop offset="100%" stop-color="#aa7926"/>
    </linearGradient>

    <!-- Card Shadow (Soft warm drop) -->
    <filter id="cardDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#060402" flood-opacity="0.75"/>
    </filter>

    <!-- Tile Shadow -->
    <filter id="tileDrop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#040302" flood-opacity="0.7"/>
    </filter>

    <style>
      .font-disp {
        font-family: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .font-mach {
        font-family: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
    </style>
  </defs>

  <!-- ── 1. Page / Machine Ground ────────────────────────────────────────── -->
  <rect width="300" height="200" fill="url(#bgGrad)"/>
  <rect width="300" height="200" fill="url(#ambientWarmth)"/>

  <!-- Outer Machined Housing Hairline Rim -->
  <rect x="0.5" y="0.5" width="299" height="199" fill="none" stroke="rgba(226, 214, 192, 0.08)" stroke-width="1"/>
  <line x1="1" y1="1" x2="299" y2="1" stroke="rgba(255, 238, 208, 0.12)" stroke-width="1"/>

  <!-- ── 2. Top Deck: 5 Engine Bay Cards ("ALPHA") ──────────────────────── -->
  <g filter="url(#cardDrop)">

    <!-- Card 1: A (Letter / Verdigris) -->
    <g transform="translate(20, 16)">
      <!-- Body -->
      <rect width="46" height="66" rx="4.5" fill="url(#cardBody)" stroke="rgba(20, 14, 8, 0.85)" stroke-width="1.2"/>
      <!-- Paint-coded top tooling stripe -->
      <path d="M 0.6,4.5 A 4.5,4.5 0 0 1 4.5,0.6 L 41.5,0.6 A 4.5,4.5 0 0 1 45.4,4.5 L 45.4,5 L 0.6,5 Z" fill="#5f9e77"/>
      <!-- Top specular highlight edge -->
      <line x1="1.5" y1="6" x2="44.5" y2="6" stroke="rgba(255, 238, 208, 0.14)" stroke-width="0.8"/>
      <!-- Bottom edge shade -->
      <line x1="1.5" y1="64.5" x2="44.5" y2="64.5" stroke="rgba(0, 0, 0, 0.55)" stroke-width="0.8"/>
      <!-- Icon: Vanilla / Scoop on cone -->
      <g transform="translate(5, 8.5)" stroke="#5f9e77" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4.5" cy="3.5" r="2.8"/>
        <path d="M2.5 5 L4.5 10 L6.5 5"/>
      </g>
      <!-- Operator Chip: +1 -->
      <rect x="23.5" y="8" width="17.5" height="8.5" rx="2" fill="#5f9e77" fill-opacity="0.18" stroke="#5f9e77" stroke-width="0.8"/>
      <text class="font-mach" x="32.2" y="14.8" text-anchor="middle" font-size="5.8" font-weight="800" fill="#5f9e77">+1</text>
      <!-- Engraved Glyphs / Letter A -->
      <text class="font-disp" x="23" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f0e9dc">A</text>
    </g>

    <!-- Card 2: L (Clock / Quench Blue) -->
    <g transform="translate(73, 16)">
      <!-- Body -->
      <rect width="46" height="66" rx="4.5" fill="url(#cardBody)" stroke="rgba(20, 14, 8, 0.85)" stroke-width="1.2"/>
      <!-- Tooling stripe -->
      <path d="M 0.6,4.5 A 4.5,4.5 0 0 1 4.5,0.6 L 41.5,0.6 A 4.5,4.5 0 0 1 45.4,4.5 L 45.4,5 L 0.6,5 Z" fill="#5d97c0"/>
      <!-- Specular & Shade -->
      <line x1="1.5" y1="6" x2="44.5" y2="6" stroke="rgba(255, 238, 208, 0.14)" stroke-width="0.8"/>
      <line x1="1.5" y1="64.5" x2="44.5" y2="64.5" stroke="rgba(0, 0, 0, 0.55)" stroke-width="0.8"/>
      <!-- Icon: Clock -->
      <g transform="translate(5, 8.5)" stroke="#5d97c0" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4.5" cy="4.5" r="3.6"/>
        <path d="M4.5 2.5 V4.5 H6.5"/>
      </g>
      <!-- Operator Chip: x1.5 -->
      <rect x="21" y="8" width="20" height="8.5" rx="2" fill="#5d97c0" fill-opacity="0.18" stroke="#5d97c0" stroke-width="0.8"/>
      <text class="font-mach" x="31" y="14.8" text-anchor="middle" font-size="5.6" font-weight="800" fill="#5d97c0">×1.5</text>
      <!-- Engraved Glyphs / Letter L -->
      <text class="font-disp" x="23" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f0e9dc">L</text>
    </g>

    <!-- Card 3: P (Economy / Straw) -->
    <g transform="translate(127, 16)">
      <!-- Body -->
      <rect width="46" height="66" rx="4.5" fill="url(#cardBody)" stroke="rgba(20, 14, 8, 0.85)" stroke-width="1.2"/>
      <!-- Tooling stripe -->
      <path d="M 0.6,4.5 A 4.5,4.5 0 0 1 4.5,0.6 L 41.5,0.6 A 4.5,4.5 0 0 1 45.4,4.5 L 45.4,5 L 0.6,5 Z" fill="#efcf6e"/>
      <!-- Specular & Shade -->
      <line x1="1.5" y1="6" x2="44.5" y2="6" stroke="rgba(255, 238, 208, 0.14)" stroke-width="0.8"/>
      <line x1="1.5" y1="64.5" x2="44.5" y2="64.5" stroke="rgba(0, 0, 0, 0.55)" stroke-width="0.8"/>
      <!-- Icon: Coin Stack -->
      <g transform="translate(5, 8.5)" stroke="#efcf6e" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="4.5" cy="2.5" rx="3.5" ry="1.4"/>
        <path d="M1 2.5 V5 C1 6 8 6 8 5 V2.5"/>
        <path d="M1 5 V7.5 C1 8.5 8 8.5 8 7.5 V5"/>
      </g>
      <!-- Operator Chip: x3 -->
      <rect x="23.5" y="8" width="17.5" height="8.5" rx="2" fill="#efcf6e" fill-opacity="0.18" stroke="#efcf6e" stroke-width="0.8"/>
      <text class="font-mach" x="32.2" y="14.8" text-anchor="middle" font-size="5.8" font-weight="800" fill="#efcf6e">×3</text>
      <!-- Engraved Glyphs / Letter P -->
      <text class="font-disp" x="23" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f0e9dc">P</text>
    </g>

    <!-- Card 4: H (Utility / Oxblood) -->
    <g transform="translate(181, 16)">
      <!-- Body -->
      <rect width="46" height="66" rx="4.5" fill="url(#cardBody)" stroke="rgba(20, 14, 8, 0.85)" stroke-width="1.2"/>
      <!-- Tooling stripe -->
      <path d="M 0.6,4.5 A 4.5,4.5 0 0 1 4.5,0.6 L 41.5,0.6 A 4.5,4.5 0 0 1 45.4,4.5 L 45.4,5 L 0.6,5 Z" fill="#8b4254"/>
      <!-- Specular & Shade -->
      <line x1="1.5" y1="6" x2="44.5" y2="6" stroke="rgba(255, 238, 208, 0.14)" stroke-width="0.8"/>
      <line x1="1.5" y1="64.5" x2="44.5" y2="64.5" stroke="rgba(0, 0, 0, 0.55)" stroke-width="0.8"/>
      <!-- Icon: Vault / Brick safe -->
      <g transform="translate(5, 8.5)" stroke="#8b4254" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0.8" y="1" width="7.4" height="7" rx="1"/>
        <circle cx="4.5" cy="4.5" r="1.8"/>
      </g>
      <!-- Operator Chip: +5 -->
      <rect x="23.5" y="8" width="17.5" height="8.5" rx="2" fill="#8b4254" fill-opacity="0.18" stroke="#8b4254" stroke-width="0.8"/>
      <text class="font-mach" x="32.2" y="14.8" text-anchor="middle" font-size="5.8" font-weight="800" fill="#c47a8c">+5</text>
      <!-- Engraved Glyphs / Letter H -->
      <text class="font-disp" x="23" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f0e9dc">H</text>
    </g>

    <!-- Card 5: A (Action / Brass Anchor) -->
    <g transform="translate(234, 16)">
      <!-- Body -->
      <rect width="46" height="66" rx="4.5" fill="url(#cardBody)" stroke="rgba(20, 14, 8, 0.85)" stroke-width="1.2"/>
      <!-- Tooling stripe -->
      <path d="M 0.6,4.5 A 4.5,4.5 0 0 1 4.5,0.6 L 41.5,0.6 A 4.5,4.5 0 0 1 45.4,4.5 L 45.4,5 L 0.6,5 Z" fill="#c08f3c"/>
      <!-- Specular & Shade -->
      <line x1="1.5" y1="6" x2="44.5" y2="6" stroke="rgba(255, 238, 208, 0.14)" stroke-width="0.8"/>
      <line x1="1.5" y1="64.5" x2="44.5" y2="64.5" stroke="rgba(0, 0, 0, 0.55)" stroke-width="0.8"/>
      <!-- Icon: Anchor -->
      <g transform="translate(5, 8.5)" stroke="#c08f3c" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4.5" cy="2" r="1.1"/>
        <line x1="4.5" y1="3.1" x2="4.5" y2="8.2"/>
        <line x1="2.5" y1="4.6" x2="6.5" y2="4.6"/>
        <path d="M1.5 5.5 C1.5 8.5 7.5 8.5 7.5 5.5"/>
      </g>
      <!-- Operator Chip: +10 -->
      <rect x="21" y="8" width="20" height="8.5" rx="2" fill="#c08f3c" fill-opacity="0.18" stroke="#c08f3c" stroke-width="0.8"/>
      <text class="font-mach" x="31" y="14.8" text-anchor="middle" font-size="5.6" font-weight="800" fill="#e0b25c">+10</text>
      <!-- Engraved Glyphs / Letter A -->
      <text class="font-disp" x="23" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f0e9dc">A</text>
    </g>

  </g>

  <!-- ── 3. Bottom Composing Stick: Word Builder Track ("CHAIN") ────────── -->

  <!-- Recessed Steel Bed (The Staging Well) -->
  <g>
    <rect x="20" y="96" width="260" height="52" rx="5.5" fill="#100e0c" stroke="rgba(226, 214, 192, 0.12)" stroke-width="1"/>
    <!-- Cavity inner drop shade -->
    <rect x="21" y="97" width="258" height="3" fill="#050403" opacity="0.75"/>
    <line x1="21" y1="147.5" x2="279" y2="147.5" stroke="rgba(255, 238, 208, 0.06)" stroke-width="1"/>
  </g>

  <!-- Tiles & Submit Button Group with Tile Drops -->
  <g filter="url(#tileDrop)">

    <!-- TILE 1: Lead Succession Tile "C" (Polished Brass Matrix) -->
    <g transform="translate(27, 103)">
      <!-- Face -->
      <rect width="32" height="38" rx="3.5" fill="url(#brassFace)" stroke="rgba(24, 16, 10, 0.75)" stroke-width="0.9"/>
      <!-- Top Specular Edge -->
      <line x1="1" y1="1" x2="31" y2="1" stroke="rgba(255, 255, 255, 0.6)" stroke-width="0.9"/>
      <!-- Machined Bottom Foot / Bevel -->
      <path d="M 0.5,34.5 L 0.5,34.5 A 3.5,3.5 0 0 0 3.5,37.5 L 28.5,37.5 A 3.5,3.5 0 0 0 31.5,34.5 L 31.5,34.5 Z" fill="#8a6a2e"/>
      <!-- Incised Letter "C" -->
      <text class="font-mach" x="16" y="27" text-anchor="middle" font-size="20" font-weight="900" fill="#1a1408">C</text>
    </g>

    <!-- TILE 2: "H" (Milled Stock Tile) -->
    <g transform="translate(64, 103)">
      <rect width="32" height="38" rx="3.5" fill="url(#stockFace)" stroke="rgba(24, 16, 10, 0.65)" stroke-width="0.9"/>
      <line x1="1" y1="1" x2="31" y2="1" stroke="rgba(255, 255, 255, 0.65)" stroke-width="0.9"/>
      <path d="M 0.5,34.5 L 0.5,34.5 A 3.5,3.5 0 0 0 3.5,37.5 L 28.5,37.5 A 3.5,3.5 0 0 0 31.5,34.5 L 31.5,34.5 Z" fill="#a89d87"/>
      <text class="font-mach" x="16" y="27" text-anchor="middle" font-size="20" font-weight="900" fill="#191512">H</text>
    </g>

    <!-- TILE 3: "A" (Milled Stock Tile) -->
    <g transform="translate(101, 103)">
      <rect width="32" height="38" rx="3.5" fill="url(#stockFace)" stroke="rgba(24, 16, 10, 0.65)" stroke-width="0.9"/>
      <line x1="1" y1="1" x2="31" y2="1" stroke="rgba(255, 255, 255, 0.65)" stroke-width="0.9"/>
      <path d="M 0.5,34.5 L 0.5,34.5 A 3.5,3.5 0 0 0 3.5,37.5 L 28.5,37.5 A 3.5,3.5 0 0 0 31.5,34.5 L 31.5,34.5 Z" fill="#a89d87"/>
      <text class="font-mach" x="16" y="27" text-anchor="middle" font-size="20" font-weight="900" fill="#191512">A</text>
    </g>

    <!-- TILE 4: "I" (Milled Stock Tile) -->
    <g transform="translate(138, 103)">
      <rect width="32" height="38" rx="3.5" fill="url(#stockFace)" stroke="rgba(24, 16, 10, 0.65)" stroke-width="0.9"/>
      <line x1="1" y1="1" x2="31" y2="1" stroke="rgba(255, 255, 255, 0.65)" stroke-width="0.9"/>
      <path d="M 0.5,34.5 L 0.5,34.5 A 3.5,3.5 0 0 0 3.5,37.5 L 28.5,37.5 A 3.5,3.5 0 0 0 31.5,34.5 L 31.5,34.5 Z" fill="#a89d87"/>
      <text class="font-mach" x="16" y="27" text-anchor="middle" font-size="20" font-weight="900" fill="#191512">I</text>
    </g>

    <!-- TILE 5: "N" (Milled Stock Tile) -->
    <g transform="translate(175, 103)">
      <rect width="32" height="38" rx="3.5" fill="url(#stockFace)" stroke="rgba(24, 16, 10, 0.65)" stroke-width="0.9"/>
      <line x1="1" y1="1" x2="31" y2="1" stroke="rgba(255, 255, 255, 0.65)" stroke-width="0.9"/>
      <path d="M 0.5,34.5 L 0.5,34.5 A 3.5,3.5 0 0 0 3.5,37.5 L 28.5,37.5 A 3.5,3.5 0 0 0 31.5,34.5 L 31.5,34.5 Z" fill="#a89d87"/>
      <text class="font-mach" x="16" y="27" text-anchor="middle" font-size="20" font-weight="900" fill="#191512">N</text>
    </g>

    <!-- SUBMIT Button (Tactile Brass Stamp) -->
    <g transform="translate(213, 103)">
      <rect width="60" height="38" rx="3.5" fill="url(#btnBrassFace)" stroke="rgba(24, 16, 10, 0.75)" stroke-width="0.9"/>
      <!-- Top specular edge -->
      <line x1="1" y1="1" x2="59" y2="1" stroke="rgba(255, 255, 255, 0.65)" stroke-width="0.9"/>
      <!-- Bottom cut foot -->
      <path d="M 0.5,34.5 L 0.5,34.5 A 3.5,3.5 0 0 0 3.5,37.5 L 56.5,37.5 A 3.5,3.5 0 0 0 59.5,34.5 L 59.5,34.5 Z" fill="#8a6a2e"/>
      <!-- Submit Text -->
      <text class="font-mach" x="30" y="25" text-anchor="middle" font-size="11.5" font-weight="900" letter-spacing="0.08em" fill="#1a1408">SUBMIT</text>
    </g>

  </g>

  <!-- ── 4. Tagline / Metadata ──────────────────────────────────────────── -->
  <text class="font-mach" x="150" y="176" text-anchor="middle" font-size="8.8" font-weight="700" letter-spacing="0.24em" fill="#9c9589">WORD CHAIN <tspan fill="#c08f3c">·</tspan> ENGINE BUILDER</text>
</svg>
