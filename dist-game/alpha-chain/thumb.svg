<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="Alpha Chain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1020"/>
      <stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.22" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.82" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#ff2e8b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff2e8b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.55" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#b97bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b97bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#14f195" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#14f195" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2f86e6" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#2f86e6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#ffb020" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e36ec9" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#e36ec9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00e5ff" flood-opacity="0.5"/>
    </filter>
    <style>
    @font-face {
      font-family: 'Chakra Petch';
      font-style: normal;
      font-weight: 100 900;
      src: url(data:font/woff2;base64,) format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 100 900;
      src: url(data:font/woff2;base64,) format('woff2');
    }
      .disp { font-family: 'Chakra Petch','Segoe UI',system-ui,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Courier New',ui-monospace,monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="300" height="200" fill="url(#bg)"/>
  <rect width="300" height="200" fill="url(#glowC)"/>
  <rect width="300" height="200" fill="url(#glowM)"/>
  <rect width="300" height="200" fill="url(#glowV)"/>

  <!-- ALPHA: a row of engine-bay cards -->
  <!-- card template per family: shadow group -> base panel -> family gradient -> border -> icon + chip -> letter -->
  <g filter="url(#cardShadow)">
    <!-- A (Letter / mint) -->
    <g>
      <rect x="23" y="20" width="46" height="66" rx="7" fill="#121830"/>
      <rect x="23" y="20" width="46" height="66" rx="7" fill="url(#c1)"/>
      <rect x="23.9" y="20.9" width="44.2" height="64.2" rx="6.2" fill="none" stroke="#14f195" stroke-width="1.8"/>
      <rect x="23.9" y="20.9" width="44.2" height="2.4" fill="#ffffff" opacity="0.08"/>
      <circle cx="35" cy="34" r="4.2" fill="none" stroke="#14f195" stroke-width="1.4"/>
      <circle cx="35" cy="34" r="1.1" fill="#14f195"/>
      <rect x="47" y="29" width="15" height="9.5" rx="2.6" fill="#14f195" fill-opacity="0.16" stroke="#14f195" stroke-opacity="0.55" stroke-width="0.8"/>
      <text class="mono" x="54.5" y="36" text-anchor="middle" font-size="6.4" font-weight="800" fill="#14f195">x2</text>
      <text class="disp" x="46" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#eaf2ff">A</text>
    </g>
    <!-- L (Clock / blue) -->
    <g>
      <rect x="75" y="20" width="46" height="66" rx="7" fill="#121830"/>
      <rect x="75" y="20" width="46" height="66" rx="7" fill="url(#c2)"/>
      <rect x="75.9" y="20.9" width="44.2" height="64.2" rx="6.2" fill="none" stroke="#2f86e6" stroke-width="1.8"/>
      <rect x="75.9" y="20.9" width="44.2" height="2.4" fill="#ffffff" opacity="0.08"/>
      <circle cx="87" cy="34" r="4.2" fill="none" stroke="#2f86e6" stroke-width="1.4"/>
      <path d="M87 31.4 V34 H89" fill="none" stroke="#2f86e6" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="99" y="29" width="15" height="9.5" rx="2.6" fill="#2f86e6" fill-opacity="0.16" stroke="#2f86e6" stroke-opacity="0.55" stroke-width="0.8"/>
      <text class="mono" x="106.5" y="36" text-anchor="middle" font-size="6.4" font-weight="800" fill="#2f86e6">+5</text>
      <text class="disp" x="98" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#eaf2ff">L</text>
    </g>
    <!-- P (Economy / amber) -->
    <g>
      <rect x="127" y="20" width="46" height="66" rx="7" fill="#121830"/>
      <rect x="127" y="20" width="46" height="66" rx="7" fill="url(#c3)"/>
      <rect x="127.9" y="20.9" width="44.2" height="64.2" rx="6.2" fill="none" stroke="#ffb020" stroke-width="1.8"/>
      <rect x="127.9" y="20.9" width="44.2" height="2.4" fill="#ffffff" opacity="0.08"/>
      <circle cx="139" cy="34" r="4.2" fill="none" stroke="#ffb020" stroke-width="1.4"/>
      <circle cx="139" cy="34" r="1.1" fill="#ffb020"/>
      <rect x="151" y="29" width="15" height="9.5" rx="2.6" fill="#ffb020" fill-opacity="0.16" stroke="#ffb020" stroke-opacity="0.55" stroke-width="0.8"/>
      <text class="mono" x="158.5" y="36" text-anchor="middle" font-size="6.4" font-weight="800" fill="#ffb020">x4</text>
      <text class="disp" x="150" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#eaf2ff">P</text>
    </g>
    <!-- H (Utility / orchid) -->
    <g>
      <rect x="179" y="20" width="46" height="66" rx="7" fill="#121830"/>
      <rect x="179" y="20" width="46" height="66" rx="7" fill="url(#c4)"/>
      <rect x="179.9" y="20.9" width="44.2" height="64.2" rx="6.2" fill="none" stroke="#e36ec9" stroke-width="1.8"/>
      <rect x="179.9" y="20.9" width="44.2" height="2.4" fill="#ffffff" opacity="0.08"/>
      <circle cx="191" cy="34" r="4.2" fill="none" stroke="#e36ec9" stroke-width="1.4"/>
      <path d="M188.6 34 H193.4 M191 31.6 V36.4" stroke="#e36ec9" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="203" y="29" width="15" height="9.5" rx="2.6" fill="#e36ec9" fill-opacity="0.16" stroke="#e36ec9" stroke-opacity="0.55" stroke-width="0.8"/>
      <text class="mono" x="210.5" y="36" text-anchor="middle" font-size="6.4" font-weight="800" fill="#e36ec9">+3</text>
      <text class="disp" x="202" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#eaf2ff">H</text>
    </g>
    <!-- A (Spark / cyan) -->
    <g>
      <rect x="231" y="20" width="46" height="66" rx="7" fill="#121830"/>
      <rect x="231" y="20" width="46" height="66" rx="7" fill="url(#c5)"/>
      <rect x="231.9" y="20.9" width="44.2" height="64.2" rx="6.2" fill="none" stroke="#00e5ff" stroke-width="1.8"/>
      <rect x="231.9" y="20.9" width="44.2" height="2.4" fill="#ffffff" opacity="0.08"/>
      <circle cx="243" cy="34" r="4.2" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
      <circle cx="243" cy="34" r="1.1" fill="#00e5ff"/>
      <rect x="255" y="29" width="15" height="9.5" rx="2.6" fill="#00e5ff" fill-opacity="0.16" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="0.8"/>
      <text class="mono" x="262.5" y="36" text-anchor="middle" font-size="6.4" font-weight="800" fill="#00e5ff">x2</text>
      <text class="disp" x="254" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#eaf2ff">A</text>
    </g>
  </g>

  <!-- CHAIN: the live word-entry bar -->
  <g filter="url(#cyanGlow)">
    <rect x="23" y="104" width="254" height="46" rx="11" fill="#121830" stroke="#00e5ff" stroke-width="2"/>
  </g>
  <!-- prefix badge (required start letter) -->
  <rect x="31" y="112" width="30" height="30" rx="7" fill="#00e5ff" fill-opacity="0.16"/>
  <text class="mono" x="46" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#00e5ff">C</text>
  <!-- typed word -->
  <text class="mono" x="143" y="135" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="4" fill="#eaf2ff">CHAIN</text>
  <!-- GO button -->
  <rect x="225" y="114" width="44" height="32" rx="7" fill="#000000"/>
  <rect x="222" y="111" width="44" height="32" rx="7" fill="#00e5ff" stroke="#000000" stroke-width="3"/>
  <text class="disp" x="244" y="132" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#04121a">GO</text>

  <!-- tagline -->
  <text class="disp" x="150" y="176" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="2.4" fill="#8aa0c0">WORD CHAIN · ENGINE BUILDER</text>
</svg>
